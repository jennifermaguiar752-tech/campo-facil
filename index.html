:root{--g:#e9e2ff;--i:#12004b;--a:#1f00ab;--s:#a99ae0;--ph:#6f63a8;--r:#f9f7ff;--w:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--g);color:var(--i);font-family:"Inter Tight",system-ui,sans-serif;font-weight:400;font-size:16px;line-height:1.45}
button,input,textarea{font-family:inherit;color:inherit}

.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.btn{display:inline-block;background:var(--w);border:1px solid var(--i);border-radius:4px;padding:8px 12px;font-size:14px;font-weight:500;cursor:pointer;text-decoration:none;color:var(--i)}
.btn.p{background:var(--a);border-color:var(--a);color:var(--w)}
.btn.on{background:var(--i);color:var(--g)}
a.ref{color:var(--a);font-weight:500;text-decoration:underline;text-underline-offset:2px}

#pop{position:fixed;z-index:50;background:var(--w);border:1px solid var(--i);border-radius:4px;padding:14px;width:min(360px,calc(100vw - 24px));max-height:60vh;overflow:auto;display:none}

#pop .pv p+p{margin-top:6px}
#pop .vn{font-size:12px;color:var(--a);font-weight:500;margin-right:4px}
#pop .hint{font-size:12px;color:var(--a);margin-top:8px}
#status{font-size:13px;color:var(--a);margin-top:8px}
.more{border:1px solid var(--i);border-radius:4px;background:var(--w);margin:10px 0}
.card .more summary{background:var(--w);color:var(--a);padding:10px 12px;border-bottom:0;font-size:14px;font-weight:500;display:flex;justify-content:space-between;align-items:center}
.card .more summary::after{content:"+";font-size:18px;color:var(--i)}
.card .more[open]>summary{border-bottom:1px solid var(--i)}
.card .more[open]>summary::after{content:"–"}
.more .mb{padding:4px 12px 10px}
.fi{display:block;width:100%;background:var(--w);color:var(--i);border:1px solid var(--i);border-radius:4px;padding:10px;font-size:16px;margin:2px 0 10px}
textarea.fi{min-height:64px;resize:vertical}
.visit label.lab{display:block}

<script>
/* ---------- LIVROS DA BÍBLIA ---------- */
const BOOKS=["Gênesis","Êxodo","Levítico","Números","Deuteronômio","Josué","Juízes","Rute","1 Samuel","2 Samuel","1 Reis","2 Reis","1 Crônicas","2 Crônicas","Esdras","Neemias","Ester","Jó","Salmo","Provérbios","Eclesiastes","Cântico de Salomão","Isaías","Jeremias","Lamentações","Ezequiel","Daniel","Oseias","Joel","Amós","Obadias","Jonas","Miqueias","Naum","Habacuque","Sofonias","Ageu","Zacarias","Malaquias","Mateus","Marcos","Lucas","João","Atos","Romanos","1 Coríntios","2 Coríntios","Gálatas","Efésios","Filipenses","Colossenses","1 Tessalonicenses","2 Tessalonicenses","1 Timóteo","2 Timóteo","Tito","Filemom","Hebreus","Tiago","1 Pedro","2 Pedro","1 João","2 João","3 João","Judas","Apocalipse"];
const BK={};BOOKS.forEach((b,i)=>BK[b]=i+1);BK["Salmos"]=19;
const NAMES=Object.keys(BK).sort((a,b)=>b.length-a.length);
const VS="\\d+:\\d+(?:\\s*[-–]\\s*\\d+)?(?:\\s*,\\s*\\d+(?:\\s*[-–]\\s*\\d+)?)*";
const RX=new RegExp("(^|[^0-9A-Za-zÀ-ÿ])("+NAMES.join("|")+")\\s+("+VS+"(?:\\s*;\\s*"+VS+")*)","g");

/* ---------- VÍDEOS ---------- */
const VB="https://www.jw.org/pt/biblioteca/videos/#pt/mediaitems/";
const VID={
planeta:["Nosso planeta vai sobreviver!","LatestVideos/pub-ebtv_14_VIDEO"],
universo:["Como surgiu o universo?","VODMinistryTeachings/pub-ebtv_1_VIDEO"],
estudo:["Como é um estudo bíblico?","VODMinistryTools/pub-whbs_1_VIDEO"],
celebracao:["Lembre-se da morte de Jesus","VODMinistryTools/docid-502016800_1_VIDEO"],
porque:["Por que estudar a Bíblia?","VODMinistryTools/pub-wsb_2_VIDEO"],
morte:["Será que a morte é o fim de tudo?","VODMinistryTools/pub-imv_4_VIDEO"],
natal:["Qual é a origem do Natal?","VODMinistryTeachings/pub-ebtv_12_VIDEO"],
religioes:["Será que Deus aceita todas as religiões?","VODMinistryTeachings/docid-502018853_1_VIDEO"],
sofrimento:["Por que existe tanto sofrimento?","VODMinistryTeachings/docid-502018850_1_VIDEO"],
reino:["O que é o Reino de Deus?","VODMinistryTeachings/docid-502017850_1_VIDEO"],
jesusdeus:["Será que Jesus é Deus?","VODMinistryTeachings/pub-ebtv_2_VIDEO"]
};

/* ---------- APRESENTAÇÕES ---------- */
const CATS={deus:"Deus e a Bíblia",futuro:"Futuro e promessas",sofr:"Sofrimento, morte e consolo",fam:"Família e dia a dia",jesus:"Jesus e a Celebração",est:"Revisitas e estudo",rel:"Outras religiões"};
const PRES=[
  {id:"espirita",c:"rel",t:"Conversar com um espírita",k:"espirita espiritismo kardec kardecista reencarnacao medium espiritos centro caridade",v:["morte"],
cui:["Comece pelo que vocês têm em comum: o respeito por Jesus e o amor ao próximo. Os espíritas chamam Jesus de “guia e modelo” e valorizam muito a caridade. Elogie isso com sinceridade.","Não confunda o espiritismo kardecista com outras religiões ou práticas espiritualistas. Os seguidores de Kardec fazem distinção entre suas crenças e práticas como macumba, feitiçaria e satanismo.","Não tente rebater todas as crenças numa visita só. Escolha um assunto por vez: o sofrimento, a morte ou a ressurreição."],
a:"Muitos espíritas se dedicam à caridade e a ajudar o próximo. Isso é muito bonito.",
p:"Na sua opinião, por que até pessoas boas sofrem tanto?",
x:"João 9:1-3",
q:"Os discípulos acharam que o homem nasceu cego por causa de algum pecado. O que Jesus respondeu?",
r:"Que esperança Jesus deu para quem já morreu? (Próxima visita: João 11:11-14, 23-25)",
vis:[
["1ª revisita: a esperança para os mortos","Leia a ressurreição de Lázaro (João 11:11-14, 43, 44). Jesus disse que Lázaro estava “dormindo”. Lázaro voltou como a mesma pessoa, com a mesma idade e as mesmas lembranças. Isso não é reencarnação, é ressurreição. Pergunte: “O que esse relato mostra sobre o que Deus quer fazer pelos mortos?” (João 5:28, 29)"],
["2ª revisita: por que coisas ruins acontecem","Eclesiastes 9:11 diz que “o tempo e o imprevisto” atingem a todos. Nem todo sofrimento é castigo. Herdamos a imperfeição de Adão (Romanos 5:12), e Deus promete acabar com o sofrimento (Isaías 33:24; Apocalipse 21:3, 4)."]],
cren:["Seguem os ensinos organizados por Allan Kardec, um educador francês do século 19. O livro principal é O Livro dos Espíritos (1857). Também usam O Livro dos Médiuns e O Evangelho Segundo o Espiritismo.","Acreditam que, na morte, o espírito sai do corpo e depois reencarna para pagar os erros de vidas anteriores, sem se lembrar delas.","Acreditam que é possível falar com os espíritos dos mortos por meio de médiuns.","Veem as doenças, os acidentes e os defeitos de nascença como consequência de erros de outra vida.","Valorizam muito a caridade (“Fora da caridade não há salvação”) e mantêm hospitais, escolas e obras sociais.","Citam a Bíblia e chamam Jesus de “guia e modelo para toda a Humanidade”. Kardec via o espiritismo como a terceira revelação de Deus, depois de Moisés e de Jesus."],
tab:[
["A alma sobrevive à morte e reencarna.","Ezequiel 18:4; Eclesiastes 9:5","A alma pode morrer, e os mortos não sabem nada."],
["A reencarnação explica o sofrimento e a justiça de Deus.","Romanos 5:12; Jó 14:14, 15","O sofrimento vem do pecado herdado de Adão. Jó esperava que Deus o chamasse de volta da sepultura, ou seja, a ressurreição."],
["Jesus ensinou a reencarnação.","João 11:11-14, 23-25","Jesus comparou a morte a um sono e ensinou a ressurreição. Ele nunca falou em reencarnação."],
["João Batista era Elias reencarnado.","João 1:21; Lucas 1:17","João disse claramente “não sou” Elias. Ele veio “com o espírito e o poder de Elias”, ou seja, fez uma obra parecida."],
["Nascer de novo é reencarnar.","João 3:3; 1 Pedro 1:3","É uma mudança espiritual que acontece enquanto a pessoa ainda está viva."],
["É possível se comunicar com os mortos.","Deuteronômio 18:10-12; Isaías 8:19","Deus proíbe consultar os mortos, e essa lei está na revelação que o próprio Kardec chamava de primeira."],
["Os espíritos dos mortos podem orientar os vivos.","Salmo 146:3, 4; Eclesiastes 9:6","Quando a pessoa morre, os pensamentos dela acabam. Os mortos não participam mais de nada do que se faz aqui."],
["O sofrimento vem de erros de vidas anteriores.","João 9:1-3; Romanos 5:12","Jesus disse que nem o homem nem os pais dele tinham pecado. Herdamos a imperfeição de Adão, não erros de outra vida."]],
n:"Veja também {{morte}}, {{ressurreicao}} e {{sofrimento}}.",
src:["O espiritismo e a busca da verdadeira espiritualidade (biblioteca)","https://wol.jw.org/pt/wol/d/r5/lp-t/2001324"]},

{id:"afro",c:"rel",t:"Conversar com quem segue religiões afro-brasileiras",k:"umbanda candomble macumba terreiro orixa orixas iemanja afro oferenda despacho feitico",v:[],
cui:["Evite usar a palavra “macumba” com a pessoa, porque muitos a acham ofensiva. Prefira “umbanda” ou “candomblé”, ou pergunte como ela chama a religião dela.","Muitos também se consideram católicos. Respeite isso e nunca ridicularize as práticas da pessoa.","Se a pessoa tem medo de espíritos ou de “trabalhos” feitos contra ela, mostre com carinho que Jeová é mais forte e protege quem se aproxima dele."],
a:"Muita gente procura proteção espiritual e ajuda para os problemas da vida.",
p:"Na sua opinião, quem pode nos proteger de verdade?",
x:"Provérbios 18:10",
q:"Segundo esse texto, onde encontramos proteção? E qual é o nome de Deus? (Salmo 83:18)",
r:"Deus tem mais poder do que qualquer espírito? (Próxima visita: Tiago 4:7, 8)",
vis:[["Revisita: proteção de Jeová","Salmo 91:1, 2: quem confia em Jeová encontra refúgio nele. Tiago 4:7, 8: quem se opõe ao Diabo e se aproxima de Deus é protegido."]],
cren:["“Macumba” é um nome popular, e muitas vezes usado com preconceito, para vários cultos afro-brasileiros. Os mais conhecidos são a umbanda e o candomblé.","Muitas pessoas que se dizem católicas também frequentam terreiros. Algumas batizam os filhos nas duas religiões.","Misturam o catolicismo com ritos de origem africana e indígena. Por exemplo, Iemanjá é cultuada ao mesmo tempo como espírito, como santa africana e como a Virgem Maria.","Os ritos incluem oferendas, magia e a incorporação de espíritos (mediunidade)."],
tab:[
["Os espíritos dos mortos podem ajudar ou prejudicar os vivos.","Eclesiastes 9:5, 10","Os mortos não sabem nada e não fazem nada."],
["Oferendas e consultas aos espíritos trazem proteção.","Deuteronômio 18:10-12","Deus pede que não se pratique magia nem se consultem os mortos."],
["Podemos adorar a Deus e também a outros espíritos ou santos.","Mateus 4:10","Jesus disse que só Jeová deve ser adorado."],
["Medo de feitiço ou de “trabalho” feito contra a pessoa.","Tiago 4:7, 8; Salmo 91:1, 2","Quem se aproxima de Jeová conta com a proteção dele."]]},

{id:"judeu",c:"rel",t:"Conversar com um judeu",k:"judeu judaismo judaica israel tora sinagoga messias rabino",v:[],
cui:["Nas primeiras conversas, use só as Escrituras Hebraicas (de Gênesis a Malaquias). Diga “Escrituras Hebraicas” em vez de “Velho Testamento”.","Muitos judeus evitam pronunciar o nome de Deus por respeito e dizem “Adonai” ou “HaShem”. Fale do nome com tato, mostrando que ele aparece milhares de vezes nas Escrituras.","Não comece falando de Jesus. Primeiro construa confiança com o que vocês têm em comum."],
a:"As Escrituras Hebraicas têm uma promessa muito bonita de paz para toda a humanidade.",
p:"Você acha que um dia as nações vão viver em paz de verdade?",
x:"Miqueias 4:3, 4",
q:"Segundo o profeta, como será a vida quando Deus agir? O que você acha de cada um viver “debaixo da sua videira”, sem ninguém para assustá-lo?",
r:"Quem vai viver nessa terra de paz para sempre? (Próxima visita: Salmo 37:11, 29)",
vis:[
["Ponto em comum: um só Deus","Deuteronômio 6:4, o Shemá, que muitos judeus recitam todos os dias: “Jeová, nosso Deus, é um só Jeová.” Assim como as Testemunhas de Jeová, eles acreditam num só Deus e não aceitam a Trindade."],
["Mais tarde: o Messias","Quando já houver confiança, pergunte o que a pessoa espera do Messias. Mostre profecias das Escrituras Hebraicas, como Daniel 9:24-26 e Isaías 53:3-5, sem pressa e sem discutir."]],
cren:["Acreditam num só Deus, criador de tudo (Deuteronômio 6:4).","As Escrituras sagradas são a Tanakh (as Escrituras Hebraicas): a Torá (os cinco livros de Moisés), os Profetas e os Escritos. Muitos também seguem o Talmude, uma coleção de tradições e comentários dos rabinos.","Ainda esperam o Messias e não aceitam Jesus como Messias.","Guardam o sábado (do pôr do sol de sexta ao de sábado) e festas como a Páscoa (Pessach) e o Dia da Expiação (Yom Kippur).","Existem grupos diferentes, como ortodoxos, conservadores e reformistas. Muitos são judeus pela família e pela cultura, sem ser muito religiosos.","As ideias sobre o que acontece depois da morte variam bastante entre eles."]},

{id:"hindu",c:"rel",t:"Conversar com um hindu",k:"hindu hinduismo india carma karma reencarnacao krishna yoga ioga",v:[],
cui:["Comece por valores que vocês têm em comum: paz, não violência, família e respeito pela vida.","Não critique os deuses nem as imagens da pessoa no início. Fale primeiro do Criador e do que ele promete.","Muitos não conhecem a Bíblia. Explique de forma simples o que ela é e por que é diferente."],
a:"Muitas pessoas valorizam a paz, a família e o respeito por toda forma de vida.",
p:"Você acha que um dia o ser humano vai viver em paz com os outros e com a natureza?",
x:"Isaías 11:6-9",
q:"Que tipo de paz esse texto descreve entre as pessoas e os animais? Quem você acha que pode trazer essa paz?",
r:"Será que o sofrimento vai acabar um dia? (Próxima visita: Apocalipse 21:3, 4)",
vis:[
["Ponto em comum: um Criador","Muitos hindus acreditam numa Realidade suprema por trás de tudo. Atos 17:24-27 mostra que o Criador “não está longe de cada um de nós”. Pergunte: “Você acha que podemos conhecer pessoalmente esse Criador?”"],
["Mais tarde: o carma e a reencarnação","Só quando já houver confiança. A Bíblia também fala de colher o que se planta (Gálatas 6:7), mas mostra que os mortos não estão conscientes (Eclesiastes 9:5) e que a esperança é a ressurreição (João 5:28, 29). Veja {{ressurreicao}}."]],
cren:["Não há um fundador nem um único livro sagrado. Os textos mais conhecidos são os Vedas, os Upanixades e o Bhagavad-Gita.","Muitos adoram vários deuses, como Vishnu, Shiva e Krishna. Para muitos, esses deuses são formas de uma única Realidade suprema (Brahman).","Acreditam que a alma (atman) é imortal e renasce em outros corpos, num ciclo chamado samsara.","Carma: o que a pessoa faz nesta vida determina como será a próxima.","O objetivo final é a moksha, a libertação do ciclo de renascimentos.","Valorizam o dharma (o dever e o modo certo de viver) e a ahimsa (a não violência). Muitos são vegetarianos e respeitam muito os animais, principalmente a vaca."]},

{id:"nome",c:"deus",t:"Jeová, o nome de Deus",k:"nome jeova deus pai nosso santificado amizade",v:[],
a:"Boa tarde! Estamos falando sobre o que fazer para nos sentir mais perto de Deus. Para fazer amizade com alguém, primeiro precisamos saber o nome da pessoa.",
p:"E Deus? Ele tem nome? O que você acha?",
x:"Salmo 83:18",
q:"De acordo com a Bíblia, qual é o nome de Deus? Você já tinha visto isso na Bíblia?",
r:"A Bíblia diz que Deus tem muitas qualidades. Qual delas é a principal?",
vis:[["1ª revisita: 1 João 4:8","Repare: o texto não diz que Deus tem amor, mas que ele é amor. Então, qual é a principal qualidade dele? Deixe a pergunta: Como podemos ser amigos de Deus?"],
["2ª revisita: Tiago 4:8","Se nos esforçarmos para ser amigos de Deus, o que ele vai fazer? Deixe a pergunta: O que precisamos fazer para ser amigos de Deus? (João 17:3)"]],
n:["Outra forma de começar: “Muita gente faz a oração do Pai-Nosso. Nela Jesus disse: ‘Santificado seja o teu nome.’ Você sabe qual é o nome de Deus?”","Se a pessoa disser que “Senhor” já basta, pergunte: “Como você se sente quando alguém que você ama sabe o seu nome?”","Não esqueça de dizer seu nome e de perguntar o nome da pessoa."]},
{id:"conselhos",c:"deus",t:"Onde encontrar bons conselhos?",k:"conselhos orientacao ajuda vida biblia",v:["porque"],
a:"Olá! Estamos conversando com as pessoas sobre onde encontrar bons conselhos para a vida.",
p:"Na sua opinião, onde podemos encontrar bons conselhos?",
x:"2 Timóteo 3:16, 17",
q:"Como “toda a Escritura” pode nos ajudar? E com ela ficamos equipados para quê?",
r:"Por que podemos confiar na Bíblia? Veja {{confiar}}.",
vis:[["Revisita: Jó 26:7","O que acha de a Bíblia dizer, há tanto tempo, que a Terra está “suspensa sobre o nada”? Se podemos confiar nela na ciência, em que outros assuntos também podemos? Deixe a pergunta: Que perguntas a Bíblia responde?"]],
n:"Outra forma de começar: “Uns acham que a Bíblia é um livro de lendas; outros, a palavra de Deus. E você?” Leia Romanos 15:4: “Percebeu as formas como a Bíblia pode nos ajudar? De qual mais precisamos agora?”"},
{id:"confiar",c:"deus",t:"Podemos confiar na Bíblia?",k:"confiar biblia confianca inspirada homens verdade",v:["porque"],
a:"Hoje existem muitas opiniões sobre como viver. Muitos procuram uma orientação confiável.",
p:"Você acha que dá para confiar na Bíblia hoje em dia?",
x:"2 Timóteo 3:16, 17",
q:"Segundo esse texto, de onde vêm as ideias da Bíblia? Para que ela é útil?",
r:"Que motivos temos para confiar que a Bíblia vem de Deus?",
vis:[
["Ciência","Jó 26:7 diz que a Terra está suspensa “sobre o nada”, e Isaías 40:22 fala do “círculo da terra”. Jó 36:27, 28 descreve o ciclo da água. Veja também {{ciencia}}."],
["Exatidão histórica e sobrevivência","Muitos tentaram destruir a Bíblia, mas ela é o livro mais traduzido e distribuído da história. É exata em nomes, lugares e costumes. Isaías 40:8."],
["Conselhos úteis, sem contradições","Os conselhos da Bíblia funcionam hoje: no casamento, com os filhos e no controle da raiva (Isaías 48:17; Lucas 11:28). São 66 livros, cerca de 40 escritores e 1.600 anos de escrita, com uma só mensagem."],
["Profecias cumpridas","Isaías disse o nome de Ciro, que conquistaria Babilônia, uns 200 anos antes. Isaías 44:28; 45:1. Isaías 46:10; Daniel 2:44."],
["Honestidade dos escritores","Os escritores registraram os próprios erros. Por exemplo, Moisés contou que falhou e não entrou na Terra Prometida. Números 20:12."],
["E a interpretação?","Se a pessoa disser que cada um interpreta de um jeito, veja {{interpretacao}}. 2 Pedro 1:20, 21."]],
n:["Também serve como revisita, na porta ou por telefone: “Olá! Aqui é ___. Conversei com você na semana passada e fiquei de mostrar como podemos confiar na Bíblia. Antes, queria saber sua opinião: como sabemos que ela vem de Deus?”","Se a pessoa disser “Não acho que ela é inspirada”: “Agradeço sua sinceridade. Se não se importar, por que pensa assim?” Ouça e escolha um dos caminhos acima.","Se Deus é o Autor, faz sentido pedir a ajuda dele para entender o que escreveu (Tiago 1:5).","Para a próxima visita: se a Bíblia vem de Deus, o que ela diz sobre o futuro da Terra? (Salmo 37:29)"]},
{id:"ciencia",c:"deus",t:"A Bíblia e a ciência",k:"ciencia cientifico terra espaco universo",v:["universo"],
a:"Muita gente acha que ciência e Bíblia não combinam. Posso mostrar uma coisa curiosa em menos de um minuto?",
p:"Você acha que um livro antigo pode estar certo sobre assuntos científicos?",
x:"Jó 26:7",
q:"Esse texto foi escrito há mais de 3 mil anos. O que ele diz sobre a Terra? Como o escritor poderia saber disso?",
r:"Que outros detalhes mostram que a Bíblia vem de Deus? (Isaías 40:22; Jó 36:27, 28)",
vis:[["Revisita: Hebreus 3:4","Se uma casa precisa de alguém que a construa, o que dizer do universo? Veja {{criacao}}."]]},
{id:"criacao",c:"deus",t:"Deus existe? Como surgiu o universo?",k:"criacao universo evolucao criador origem existe deus",v:["universo"],
a:"Quando olhamos a natureza, vemos uma organização impressionante.",
p:"Na sua opinião, tudo isso surgiu por acaso ou alguém fez?",
x:"Hebreus 3:4",
q:"Se uma casa precisa de alguém que a construa, o que dizer do universo?",
r:"Deus tem um nome? (Salmo 83:18)",
vis:[["Revisita: Romanos 1:20","Que coisas da natureza mostram para você as qualidades do Criador?"]],
n:"Outra forma de começar: “Algumas pessoas confiam em Deus, outras acham difícil acreditar nele. No seu caso, dá para ter certeza de que Deus existe?”"},
{id:"oracao",c:"deus",t:"Deus ouve as orações?",k:"oracao orar rezar pedir ouvir",v:[],
a:"Olá! Muita gente ora, mas às vezes fica em dúvida se Deus está ouvindo.",
p:"Acha que Deus ouve todas as orações?",
x:"Salmo 65:2",
q:"Como esse texto chama Deus? O que isso nos ensina?",
r:"Pelo que podemos orar?",
vis:[["Revisita: 1 João 5:14","Se você pedisse um milhão de reais, será que Deus daria? E será que podemos pedir ajuda para fazer o que é certo? Deixe a pergunta: Como Deus responde às nossas orações?"]]},
{id:"importa",c:"deus",t:"Deus se importa com a gente?",k:"deus importa cuida amor ansiedade problemas",v:[],
a:"Bom dia! Muitas pessoas se perguntam se Deus vê o que acontece com a gente e se somos importantes para ele.",
p:"Como você acha que Deus mostra que se importa com as pessoas?",
x:"1 Pedro 5:6, 7",
q:"Segundo o versículo 7, Deus nos convida a fazer o quê? Como podemos “lançar” sobre ele a nossa ansiedade?",
r:"Como sabemos que Deus se preocupa com cada um de nós?",
vis:[["1ª revisita: Mateus 10:29-31","O que Deus sabe sobre cada pardal? E ele sabe até o número de quê? Deixe a pergunta: Será que Deus entende o que sentimos?"],
["2ª revisita: Salmo 139:1, 2, 4","O que nesses versículos mostra que Deus entende tudo o que sentimos? Deixe a pergunta: Se Deus se importa, por que existe tanto sofrimento? Veja {{sofrimento}}."]],
n:"Se a pessoa disser algo que não está totalmente certo (por exemplo, “Deus está no controle de tudo”), aproveite a parte certa da resposta (“Deus cuida de nós”) para continuar a conversa."},
{id:"religioes",c:"deus",t:"Será que Deus aceita todas as religiões?",k:"religiao religioes verdadeira todas igrejas dinheiro falso",v:["religioes"],
a:"Hoje existem milhares de religiões, e todas dizem que estão certas.",
p:"Será que Deus aceita todas as religiões?",
x:"Mateus 7:13, 14",
q:"Segundo Jesus, todos os caminhos levam à vida? Quantos encontram o caminho certo?",
r:"Como identificar a religião verdadeira?",
vis:[
["Ilustração do dinheiro","Existe dinheiro falso porque existe o verdadeiro. Quem conhece bem o dinheiro verdadeiro identifica na hora o falso. A religião verdadeira também é identificada pelas crenças e pelo modo de vida."],
["O que pensam sobre Deus, Jesus e a Bíblia","Salmo 83:18 (o nome de Deus). Mateus 20:28 (Jesus deu a vida por nós). 2 Timóteo 3:16, 17 (a Bíblia vem de Deus)."],
["Como vivem no dia a dia","Mateus 24:14 (pregam sobre o Reino). Marcos 12:17 (respeitam as autoridades). João 13:35 (amor entre eles)."]],
n:["Não precisa usar tudo numa conversa só. Escolha uma parte e deixe o resto para as próximas visitas.","A maioria ainda não encontrou a religião verdadeira, e isso não deve nos surpreender: Jesus disse que poucos encontram o caminho."]},
{id:"basta",c:"deus",t:"Será que basta acreditar em Deus?",k:"basta acreditar fe crer adorar religiao",v:["religioes"],
a:"Muitos dizem: “O importante é acreditar em Deus.”",
p:"Você acha que só acreditar em Deus é suficiente, ou importa a maneira como o adoramos?",
x:"Tiago 2:19",
q:"Se até os demônios acreditam, o que mais Deus espera de nós?",
r:"Por que vale a pena adorar a Deus do jeito certo? (Próxima visita: 2 Pedro 3:9, 13)",
vis:[["Sair da adoração falsa","2 Coríntios 6:17: para ser acolhido por Deus, é preciso se separar da adoração falsa."],["Por que adorar do jeito certo","2 Pedro 3:9, 13: Deus quer que todos tenham a chance de viver nos novos céus e na nova terra."]]},
{id:"futuro",c:"futuro",t:"Dá para saber o futuro?",k:"futuro saber profecia promessa",v:[],
a:"Bom dia! Todos nós queremos saber o que vai acontecer no nosso futuro e no da nossa família.",
p:"Será que dá para saber? O que acha?",
x:"Isaías 46:10",
q:"De acordo com o texto, o que Deus anuncia?",
r:"Se Deus pode dizer como será o futuro, o que ele promete para os humanos e para a Terra?",
vis:[["1ª revisita: Salmo 37:29","Quem vai possuir a Terra, e por quanto tempo? Deixe a pergunta: O que precisamos fazer para viver para sempre?"],
["2ª revisita: Salmo 37:34","O versículo diz que precisamos fazer algumas coisas. Quais são? (Esperar em Jeová e seguir o caminho dele.) Deixe a pergunta: Que caminho Deus quer que cada um de nós siga?"]],
n:"Antes de sair, pense em que pergunta deixar para preparar a revisita."},
{id:"futuro2",c:"futuro",t:"Um futuro sem dor",k:"futuro otimista dor promessa",v:[],
a:"Olá! Estamos levando aos vizinhos uma visão positiva do futuro.",
p:"Com tudo o que acontece, você consegue ser otimista em relação ao futuro?",
x:"Apocalipse 21:3, 4",
q:"O que vai acontecer no futuro, de acordo com esse texto? Que parte você mais gostou?",
r:"O que precisamos fazer para receber as coisas boas que Deus prometeu?",
vis:[["Revisita: João 3:16","Quem vai receber as coisas boas que Deus prometeu, incluindo viver para sempre? Deixe a pergunta: O que significa exercer fé? Basta acreditar que Jesus existiu?"]]},
{id:"reino",c:"futuro",t:"O que é o Reino de Deus?",k:"reino deus governo pai nosso venha filhos",v:["reino"],
a:"Bom dia! Vi que tem brinquedos no quintal. Você tem filhos? (Adapte ao que você observar.)",
p:"Como você acha que vai ser o futuro dos nossos filhos?",
x:"Mateus 6:9, 10",
q:"Como a Terra vai ser quando a vontade de Deus for feita aqui? De todos os problemas do mundo, qual você gostaria que acabasse?",
r:"Como vai ser a vida quando o Reino de Deus governar a Terra?",
vis:[["Revisita: Isaías 65:21-23","Que coisas boas o Reino de Deus vai fazer por nós? Qual delas você não vê a hora de acontecer? Deixe a pergunta: Quem vão ser os governantes desse Reino?"]],
n:["Outra forma de começar: “No Pai-Nosso, Jesus ensinou a orar: ‘Venha o teu Reino.’ O que você acha que é esse Reino?” Leia Daniel 2:44: “O que o Reino de Deus vai fazer com os governos humanos?”","Ou: “Muita gente gostaria de um governo que acabasse de verdade com a corrupção. Acha que existe um governo assim?”"]},
{id:"proposito",c:"futuro",t:"O que Deus quer para os humanos?",k:"proposito deus quer humanos paraiso terra",v:["planeta"],
a:"Olá! Meu nome é ___. Estamos perguntando a opinião das pessoas sobre o que Deus quer para os humanos.",
p:"O que você acha?",
x:"Gênesis 1:28",
q:"O que Deus queria que Adão e Eva fizessem?",
r:"Hoje a Terra não é um paraíso. Será que Deus falhou, ou ele ainda vai cumprir sua promessa?",
vis:[["1ª revisita: Isaías 55:11","Foi Deus quem disse essas palavras. Você acha que ele vai cumprir o que prometeu? Deixe a pergunta: Como vai ser a vida na Terra quando Deus cumprir a promessa?"],
["2ª revisita: Salmo 37:10, 11","Como vai ser o futuro que Deus quer para nós? Que parte do texto você mais gostou? Deixe a pergunta: O que temos de fazer para ter essas bênçãos? (Ofereça o curso bíblico.)"]]},
{id:"terra",c:"futuro",t:"Será que a Terra vai ser destruída?",k:"terra planeta destruida fim mundo meio ambiente clima",v:["planeta"],
a:"Hoje se fala muito em poluição e mudanças no clima.",
p:"Você acha que a Terra vai ser destruída um dia?",
x:"Eclesiastes 1:4",
q:"O que esse texto diz que acontece com a Terra?",
r:"Para quem Deus deu a Terra, e o que ele vai fazer com quem a estraga? (Salmo 115:16; Apocalipse 11:18)"},
{id:"paraiso",c:"futuro",t:"Vida no paraíso",k:"paraiso futuro vida eterna terra promessa",v:["planeta"],
a:"Todo mundo quer ter uma vida tranquila, uma casa e saúde.",
p:"Você acha que um dia vamos viver num mundo sem doença e sem violência?",
x:"Isaías 65:21-23",
q:"Que promessas desse texto você gostaria de ver cumpridas?",
r:"Quem vai viver nesse paraíso? (Próxima visita: Salmo 37:29)"},
{id:"paz",c:"futuro",t:"Paz e guerra",k:"paz guerra conflito",v:["reino"],
a:"Bom dia! Todo mundo diz que quer paz, inclusive os governantes.",
p:"Por que acha que é tão difícil ter paz de verdade?",
x:"Salmo 46:9",
q:"Quem esse texto diz que vai acabar com as guerras?",
r:"Como Deus vai trazer paz para o mundo inteiro? (Daniel 2:44)"},
{id:"crime",c:"futuro",t:"Crime e segurança",k:"crime violencia seguranca medo rua",v:["reino"],
a:"Olá! Há tanta violência que muita gente nem sai tranquila à noite.",
p:"Acha que um dia vamos poder andar na rua sem medo?",
x:"Salmo 37:10, 11",
q:"Segundo esse texto, o que vai acontecer com os maus, e quem vai viver na Terra?",
r:"Como vai ser a vida sem medo? (Miqueias 4:4)"},
{id:"saude",c:"futuro",t:"Doenças e fome",k:"saude doenca fome doente",v:[],
a:"Olá! Muitas pessoas ficam preocupadas com tantas doenças que aparecem hoje.",
p:"Você acha que algum dia não vão mais existir doenças?",
x:"Isaías 33:24",
q:"O que vai acontecer com as doenças no futuro?",
r:"Muita gente fica doente por causa da fome. Será que esse problema também vai acabar?",
vis:[["1ª revisita: Salmo 72:16","De acordo com esse texto, como o problema da fome vai ser resolvido? Deixe a pergunta: Que esperança existe para os que já morreram?"],
["2ª revisita: João 5:28, 29","O que vai acontecer com os mortos? Deixe a pergunta: Por que podemos confiar nessas promessas?"]],
n:"Se a pessoa disser “parece bom demais para ser verdade”: concorde que não dá para acreditar em qualquer coisa, mas a Bíblia dá bons motivos para confiar (Josué 21:45)."},
{id:"demora",c:"futuro",t:"Por que Deus está demorando?",k:"demora deus demorando paciencia fim mal",v:[],
a:"Muitos se perguntam por que Deus ainda não acabou com os problemas.",
p:"Por que você acha que Deus ainda não agiu?",
x:"2 Pedro 3:9",
q:"Segundo esse texto, a demora é falta de interesse? Por que Deus é paciente?",
r:"Como sabemos que esse tempo de espera está acabando? Veja {{ultimos}}.",
n:"Para mostrar que Deus cumpre o que promete: Isaías 55:11; Números 23:19."},
{id:"ultimos",c:"futuro",t:"Vivemos nos últimos dias?",k:"ultimos dias profecia fim mundo sinais",v:[],
a:"Gostaria de mostrar uma profecia que está se cumprindo hoje.",
p:"Você acha que as pessoas estão mudando para pior?",
x:"2 Timóteo 3:1-5",
q:"Você percebeu em que época as pessoas seriam assim? Últimos dias do quê?",
r:"O que vem depois dos últimos dias? (Próxima visita: Daniel 2:44)"},
{id:"injustica",c:"futuro",t:"Vai acabar a injustiça?",k:"injustica corrupcao justica pobres governo",v:["reino"],
a:"Vemos muita corrupção e injustiça nas notícias.",
p:"Você acha que algum dia a injustiça vai acabar?",
x:"Salmo 72:12-14",
q:"Como esse Rei vai tratar os pobres e os que sofrem?",
r:"Por que os governos humanos não conseguem resolver isso? (Eclesiastes 8:9; Jeremias 10:23)"},
{id:"sofrimento",c:"sofr",t:"Por que existe tanto sofrimento?",k:"sofrimento sofrer mal deus permite culpa violencia",v:["sofrimento"],
a:"Bom dia! Estamos falando com as pessoas sobre a violência que vemos em todo lugar. Você viu a notícia de… ?",
p:"Muitos se perguntam por que existe tanto sofrimento. Será que existe uma resposta?",
x:"1 João 5:19",
q:"De acordo com o texto, o mundo inteiro está no poder de quem? Você vê evidências disso?",
r:"O que Deus sente quando nos vê sofrer?",
vis:[["1ª revisita: Isaías 63:9","Como Deus se sentiu ao ver seu povo sofrer? E o que ele fez por eles? Deixe a pergunta: Como Deus vai acabar com o sofrimento?"],
["2ª revisita: Mateus 6:9, 10","Oramos para que a vontade de Deus seja feita onde? Deixe a pergunta: O que é o Reino de Deus? Veja {{reino}}."]],
n:["Outra forma de começar: “Quando acontece uma tragédia, muitos perguntam: ‘Por que Deus deixou isso acontecer?’” Leia Tiago 1:13: “Deus é o culpado pelo sofrimento?”","Se a pessoa estiver com pressa: “Sem problema, é rápido.” Leia só o texto, faça uma pergunta e combine a volta."]},
{id:"morte",c:"sofr",t:"O que acontece quando morremos?",k:"morte morrer mortos alma onde estao",v:["morte"],
a:"Bom dia! Estamos falando sobre um assunto que mexe com todo mundo: a morte. As religiões ensinam coisas bem diferentes sobre isso.",
p:"Qual a sua opinião? O que acontece quando morremos?",
x:"Eclesiastes 9:5, 10",
q:"Se não há trabalho nem planejamento na Sepultura, qual é a situação dos mortos? Precisamos ter medo de que estejam sofrendo?",
r:"A morte é o fim de tudo, ou os mortos podem voltar a viver?",
vis:[["1ª revisita: Atos 24:15","De acordo com o texto, que esperança nós temos? (“Ressurreição” quer dizer voltar à vida.) Deixe a pergunta: Onde vai ser a ressurreição: no céu ou aqui na Terra?"],
["2ª revisita: João 5:28, 29","O que vai acontecer com os que estão nos túmulos memoriais? Deixe a pergunta: Por que podemos confiar nessa promessa?"]],
n:"Outra forma de começar: “Será que Deus queria que a morte fizesse parte da nossa vida?” Leia Apocalipse 21:4: “O que Deus vai fazer com a morte?”"},
{id:"ressurreicao",c:"sofr",t:"Vamos ver de novo quem morreu?",k:"ressurreicao mortos voltar viver esperanca rever",v:["morte"],
a:"Olá! Quase todo mundo já perdeu alguém querido. Queria mostrar uma esperança que consola muito.",
p:"Acha que é possível ver de novo uma pessoa que morreu?",
x:"Jó 14:14, 15",
q:"O que Jó acreditava que ia acontecer depois de morrer? E o versículo 15 diz que Deus tem saudade… O que isso mostra?",
r:"Como vai ser o mundo quando Deus ressuscitar as pessoas?",
vis:[["Revisita: Isaías 32:18","Como vai ser a vida quando Deus ressuscitar as pessoas que amamos? Deixe a pergunta: Como Deus vai trazer paz para a Terra?"]],
n:["Outra forma de começar: “Jesus comparou a morte a um sono.” Leia João 5:28, 29: “O que Jesus prometeu para os que estão nos túmulos?”","Para mostrar que Deus quer fazer isso: Lucas 20:37, 38; Atos 24:15.","Na preparação, combine com seu parceiro qual parte do texto destacar (aqui, a saudade que Jeová sente dos mortos)."]},
{id:"depressao",c:"sofr",t:"Ajuda para quem está desanimado",k:"depressao desanimo tristeza triste",v:[],
a:"Bom dia! Hoje muita gente se sente triste ou sobrecarregada. Estamos mostrando um consolo que vem da Bíblia.",
p:"Onde você acha que uma pessoa pode encontrar forças quando está assim?",
x:"Salmo 34:18",
q:"Segundo esse texto, onde Jeová está quando alguém está com o coração quebrantado?",
r:"Que convite Jesus faz para quem está sobrecarregado?",
vis:[["Revisita: Mateus 11:28, 29","O que Jesus promete para quem está cansado? Depois mostre Isaías 41:10: como Deus nos dá forças?"]],
n:"Mostre empatia. Se a pessoa falar em se machucar, incentive com carinho que ela procure ajuda profissional."},
{id:"consolo",c:"sofr",t:"Consolo para quem perdeu alguém",k:"luto consolo perda morte falecido",v:["morte"],
a:"Perder alguém dói muito.",
p:"O que você acha que traz consolo de verdade nessas horas?",
x:"2 Coríntios 1:3, 4",
q:"Como esse texto descreve Jeová?",
r:"Que esperança Deus dá para quem está de luto? (1 Tessalonicenses 4:13)"},
{id:"felicidade8",c:"sofr",t:"Por que sofremos? (conversa mais longa)",k:"sofremos sofrimento adao pecado felicidade",v:[],
a:"Todos querem ser felizes, não é mesmo?",
p:"Vivemos uma vida curta e difícil. Será que era isso que Deus queria para nós?",
x:"Salmo 37:29",
q:"Segundo esse texto, qual era o propósito original de Deus para os humanos?",
r:"O que precisamos fazer para viver no futuro que Deus prometeu? (João 17:3)",
n:["Explique sobre Adão e Eva: por causa do pecado de Adão, não aproveitamos a vida como Deus queria no início (Romanos 5:12; Romanos 8:20).","Paulo disse que estava sujeito ao pecado, mas que “tinha prazer na lei de Deus” (Romanos 7:14, 19, 22-24).","A esperança de vida eterna foi prometida por Deus, que não pode mentir (Tito 1:1, 2). Por isso, vale a pena usar o tempo agora para conhecer a Deus."]},
{id:"familia",c:"fam",t:"Felicidade em família",k:"familia casamento feliz marido esposa",v:[],
a:"Bom dia! Estamos conversando com os vizinhos sobre como a Bíblia pode ajudar as famílias.",
p:"Na sua opinião, o que mais ajuda uma família a ser feliz?",
x:"Colossenses 3:13, 14",
q:"Que qualidades esse texto recomenda? Como elas ajudam em casa?",
r:"O que a Bíblia aconselha aos maridos e às esposas? (Efésios 5:33)"},
{id:"educar",c:"fam",t:"Educar os filhos",k:"filhos pais educar jovens drogas responsaveis",v:[],
a:"Bom dia! Estamos conversando com os vizinhos sobre como a Bíblia pode ajudar as famílias.",
p:"Na sua opinião, como os pais podem ajudar os filhos a serem responsáveis?",
x:"Provérbios 22:6",
q:"O que os pais precisam fazer desde que os filhos são pequenos? Educá-los no quê?",
r:"Como os jovens podem evitar problemas?",
vis:[["1ª revisita: Provérbios 4:5, 6","O que os jovens precisam adquirir? Como a sabedoria vai protegê-los? Deixe a pergunta: Onde encontrar bons conselhos para o dia a dia?"],

["3ª revisita: Provérbios 2:11","Como o raciocínio e o discernimento ajudam um jovem a quem oferecem drogas? Deixe a pergunta: Por que os conselhos da Bíblia sempre funcionam?"]],

{id:"natal",c:"jesus",t:"Qual é a origem do Natal?",k:"natal origem dezembro festa",v:["natal"],

{id:"estudo",c:"est",t:"Oferecer o curso bíblico",k:"estudo biblico curso gratuito oferecer",v:["estudo","porque"],
a:"Bom dia! Estamos falando sobre aulas gratuitas da Bíblia que respondem perguntas como “Por que existe tanto sofrimento?” e “Como ter uma família feliz?”. Este vídeo curto explica melhor.",

/* ---------- OBJEÇÕES ---------- */
const OG=["Interesse e tempo","Religião","Testemunhas de Jeová","Bíblia","Deus e a criação","Futuro","Família","Sangue","Outras religiões"];
const OBJ=[
{id:"o1",g:0,rs:"Raciocínios, p. 16",t:"Não tenho interesse",r:["“Tudo bem, respeito sua opinião. Posso só deixar uma promessa bonita da Bíblia?” Salmo 37:10, 11.","Pergunte com bondade se é a Bíblia ou a religião em geral que não interessa. Muitos se afastaram por causa da hipocrisia religiosa, e a Bíblia também condena isso.","Mude para um assunto comum, como o futuro, os filhos ou a segurança: “Vê alguma solução real para isso?”"],x:"Apocalipse 21:3, 4"},
{id:"o2",g:0,rs:"Raciocínios, p. 19-20",t:"Estou ocupado agora",r:["“Entendo, não quero atrapalhar. Vou ser bem breve.” Diga a ideia principal em duas frases.","Mostre um texto, deixe uma pergunta e combine dia e horário para voltar."],x:"Salmo 37:29"},
{id:"o3",g:0,t:"Estou de saída",r:["“Não vou atrasar você!” Faça uma pergunta e deixe um convite ou uma publicação: “Na próxima vez, mostro a resposta da Bíblia.”"]},
{id:"o4",g:0,rs:"Raciocínios, p. 20-21",t:"Não tenho dinheiro",r:["“Não estamos pedindo dinheiro. O curso bíblico é gratuito.”"],x:"Mateus 10:8"},
{id:"o5",g:0,rs:"Raciocínios, p. 20",t:"Por que vocês vêm sempre?",r:["Jesus mandou pregar em toda a Terra (Mateus 24:14; Mateus 28:19, 20).","“Porque cremos que vivemos nos últimos dias, e é importante todos pensarem no que vem pela frente.”","“Porque amamos a Deus e ao próximo.” Muita gente muda de opinião com o tempo."],x:"Mateus 22:37-39"},
{id:"o6",g:1,rs:"Raciocínios, p. 16-17",t:"Religião não me interessa",r:["Concorde que as igrejas não tornaram o mundo melhor e pergunte se a pessoa acredita em Deus.","“Mas com certeza você se interessa pelo seu futuro. A Bíblia previu as condições de hoje.”"],x:"2 Timóteo 3:1-5"},
{id:"o7",g:1,rs:"Raciocínios, p. 18-19",t:"Já tenho minha religião",r:["“Que bom que você se interessa por religião. Não viemos obrigar ninguém a mudar. Mostramos o que a Bíblia diz, como os bereanos, que conferiam tudo nas Escrituras” (Atos 17:11).","“Sua religião ensina que pessoas justas vão viver na Terra para sempre?” (Salmo 37:29)","Leia João 4:23, 24 e pergunte o que é adorar “com verdade”. Depois leia João 17:17."],x:"Atos 17:11"},
{id:"o8",g:1,rs:"Raciocínios, p. 19",t:"Aqui já somos cristãos",r:["“Que bom! Então você sabe que Jesus pregava de cidade em cidade. Sabe qual era o tema da pregação dele?” (Lucas 8:1)","Leia Mateus 7:21-23: precisamos fazer a vontade do Pai (João 17:3)."],x:"Lucas 8:1"},
{id:"o9",g:1,rs:"Raciocínios, p. 316",t:"Toda religião tem alguma coisa boa",r:["“É verdade que há pessoas sinceras em todas as religiões. Mas eu acredito que só existe uma forma certa de adorar a Deus, porque Jesus disse que nem todo o que diz ‘Senhor, Senhor’ vai entrar no Reino, mas quem faz a vontade do Pai.” (Mateus 7:21)","Veja {{religioes}}."],x:"Mateus 7:21"},
{id:"o10",g:1,t:"Minha religião é uma das maiores do mundo",r:["Com educação: “Muitas pessoas pensam como você. Mas eu penso diferente porque Jesus disse que o caminho para a vida é estreito e poucos o encontram.” (Mateus 7:13, 14)","O que importa não é quantos seguem, mas se o ensino está de acordo com a Bíblia."],x:"Mateus 7:13, 14"},
{id:"o11",g:1,t:"Basta acreditar em Deus",r:["Tiago 2:19 mostra que até os demônios acreditam. Deus espera que a gente o adore do jeito que ele aprova. Veja {{basta}}."],x:"Tiago 2:19"},
{id:"o12",g:1,t:"Religião é coisa pessoal, não discuto",r:["Concorde que é uma decisão pessoal. Mas Deus quer que o procuremos, e ele não está longe de nós (Atos 17:26, 27). Só queremos mostrar o que a Bíblia diz."]},
{id:"o13",g:1,rs:"Raciocínios, p. 315",t:"Tem muita hipocrisia na religião",r:["Concorde. Jesus também condenou a hipocrisia religiosa (Mateus 15:7-9).","Ilustração: a existência de dinheiro falso não torna falso o verdadeiro. Vale a pena procurar a adoração que Deus aprova."],x:"Mateus 15:7-9"},
{id:"o14",g:1,rs:"Raciocínios, p. 315",t:"Levo uma vida correta, isso basta",r:["“Que bom! Mas pense: se um filho levasse uma vida correta e nunca conversasse com o pai, será que o pai ficaria satisfeito?” Deus quer que o conheçamos (João 17:3)."],x:"Mateus 7:21"},
{id:"o15",g:1,rs:"Raciocínios, p. 317",t:"Leio a Bíblia em casa e faço minhas orações",r:["“Que ótimo que você lê a Bíblia!” O eunuco etíope lia as Escrituras e mesmo assim aceitou ajuda para entender (Atos 8:30, 31).","Deus também quer que seus adoradores se reúnam (Hebreus 10:24, 25)."],x:"Atos 8:30, 31"},
{id:"o16",g:1,t:"Não sigo nenhuma religião",r:["Muitos se decepcionaram com a religião. Mas Jesus disse que são felizes os que têm consciência da sua necessidade espiritual (Mateus 5:3). “Você já leu a Bíblia por conta própria?”"],x:"Mateus 5:3"},
{id:"o17",g:2,rs:"Raciocínios, p. 17-18",t:"Não me interesso pelas Testemunhas de Jeová",r:["“Já se perguntou por que voluntários fazem essas visitas, mesmo sabendo que muitos não nos recebem bem?”","Com respeito: “Posso perguntar do que não gosta: do que mostramos na Bíblia ou da visita em si?”"],x:"Mateus 24:14"},
{id:"o18",g:2,t:"Vocês são uma seita americana",r:["Os primeiros cristãos também eram chamados de seita (Atos 28:22). Estamos em mais de 200 países e seguimos a Bíblia, não costumes de um país. O nosso nome vem de Isaías 43:10."],x:"Isaías 43:10"},
{id:"o19",g:2,rs:"Raciocínios, p. 220",t:"Vocês não acreditam em Jesus",r:["“Cremos, sim! Jesus é o Filho de Deus e nosso Salvador.” (João 3:16; Atos 4:12)","Cremos no que ele próprio disse sobre si mesmo (João 14:28)."],x:"João 3:16"},
{id:"o20",g:2,t:"Vocês têm uma Bíblia só de vocês",r:["Usamos qualquer tradução, e posso mostrar na sua. A Tradução do Novo Mundo é fiel aos textos originais e usa o nome de Deus onde ele aparece (Salmo 83:18)."],x:"Salmo 83:18"},
{id:"o21",g:3,rs:"Raciocínios, p. 70",t:"A Bíblia foi escrita por homens",r:["“Sim, uns 40 homens. Mas, assim como uma secretária escreve a carta que o chefe dita, a mensagem é de Deus.” (2 Timóteo 3:16; 2 Pedro 1:21)","A harmonia de 66 livros escritos ao longo de 1.600 anos mostra que houve um único Autor. Veja {{confiar}}."],x:"2 Timóteo 3:16"},
{id:"o22",g:3,rs:"Raciocínios, p. 70",t:"A Bíblia se contradiz",r:["Pergunte com calma: “Que contradição você tem em mente?” Muitas vezes, o contexto resolve.","Relatos diferentes do mesmo fato, como nos Evangelhos, mostram ângulos diferentes, como fariam testemunhas sinceras."]},
{id:"o23",g:3,rs:"Raciocínios, p. 70-71",t:"Cada um interpreta a Bíblia do seu jeito",r:["Ilustração: de que adiantaria um livro de receitas ou um dicionário que cada um interpretasse como quisesse?","Deixe a Bíblia explicar a si mesma, examinando o contexto e outros textos sobre o assunto. Veja {{interpretacao}}."],x:"2 Pedro 1:20, 21"},
{id:"o24",g:3,t:"A Bíblia está ultrapassada",r:["Os princípios da Bíblia continuam funcionando: honestidade, perdão, cuidar da saúde, família (Salmo 119:105; Isaías 48:17)."],x:"Isaías 48:17"},
{id:"o25",g:3,rs:"Raciocínios, p. 69-70",t:"Eu não acredito na Bíblia",r:["Agradeça a sinceridade e pergunte por quê. Depois mostre uma profecia cumprida ou um conselho prático. Veja {{confiar}}."],x:"Isaías 46:10"},
{id:"o26",g:4,rs:"Raciocínios, p. 125-126",t:"Não acredito em Deus",r:["“Sempre pensou assim? O que o levou a pensar desse jeito?” Ouça com atenção.","Toda casa tem um construtor (Hebreus 3:4). A ordem do universo e o design da vida mostram as qualidades de Deus (Romanos 1:20). Veja {{criacao}}."],x:"Hebreus 3:4"},
{id:"o27",g:4,rs:"Raciocínios, p. 126",t:"Só acredito no que vejo",r:["Acreditamos em muitas coisas que não vemos, como o vento, a gravidade e as ondas de rádio, porque vemos os efeitos delas. A criação é o efeito que mostra o Criador (Romanos 1:20)."],x:"Hebreus 3:4"},
{id:"o28",g:4,rs:"Raciocínios, p. 155-156",t:"Eu acredito na evolução",r:["Pergunte o que convenceu a pessoa. Mostre que a vida só vem de vida e que a complexidade do corpo aponta para um Projetista (Salmo 139:14). Veja {{criacao}}."],x:"Salmo 139:14"},
{id:"o29",g:4,rs:"Raciocínios, p. 201",t:"Se Deus existisse, não haveria sofrimento",r:["É uma pergunta sincera. O sofrimento não vem de Deus (Tiago 1:13). O mundo está no poder do Maligno (1 João 5:19), e Deus vai acabar com o mal (Apocalipse 21:4). Veja {{sofrimento}}."],x:"1 João 5:19"},
{id:"o30",g:5,rs:"Raciocínios, p. 427",t:"O mundo sempre foi assim / o fim não vem nos nossos dias",r:["A Bíblia previu que haveria quem diria isso (2 Pedro 3:3, 4).","Nos dias de Noé, as pessoas também não deram atenção até o Dilúvio chegar (Mateus 24:37-39). A profecia dos últimos dias descreve o nosso tempo. Veja {{ultimos}}."],x:"Mateus 24:37-39"},
{id:"o31",g:5,t:"Falam do fim há anos e nada acontece",r:["Deus é paciente porque quer que mais pessoas sejam salvas (2 Pedro 3:9). O fim virá no tempo certo (Habacuque 2:3). Veja {{demora}}."],x:"2 Pedro 3:9"},
{id:"o32",g:5,rs:"Raciocínios, p. 305-306",t:"Não vou viver até esse tempo",r:["Mesmo quem morrer pode voltar a viver (João 11:25; Atos 24:15).","E o que aprendemos da Bíblia já melhora a vida agora (1 Timóteo 4:8)."],x:"João 11:25"},
{id:"o33",g:6,t:"O que a Bíblia diz sobre disciplina é exagerado",r:["“É verdade que a Bíblia diz que os pais devem corrigir os filhos, mas ela não incentiva os pais a serem rígidos demais. Por exemplo, ela diz: ‘Pais, não irritem os seus filhos, para que eles não desanimem.’” (Colossenses 3:21)","Na Bíblia, disciplina é principalmente ensino e treinamento com amor (Efésios 6:4)."],x:"Colossenses 3:21"},
{id:"o34",g:6,t:"Vocês separam as famílias",r:["A Bíblia ensina amor e respeito no lar, mesmo quando as crenças são diferentes (Efésios 5:33; 1 Pedro 3:1, 2).","Quando alguém muda de religião pode haver tensão, mas incentivamos a pessoa a ser um marido, uma esposa ou um filho ainda melhor. Muitas famílias ficaram mais unidas aplicando a Bíblia."],x:"Efésios 5:33"},
{id:"o35",g:7,rs:"Raciocínios, p. 346-347",t:"Vocês deixam os filhos morrer porque recusam transfusões",r:["“Nós aceitamos tratamentos, e dos mais seguros: os que não trazem o risco de doenças como AIDS, hepatite, malária ou doença de Chagas. Queremos o melhor tratamento para nossos filhos, como todo pai que ama.”","“Quando se perde muito sangue, a maior necessidade é repor o volume de líquido. Expansores de volume do plasma sem sangue fazem isso, já foram usados em milhares de pessoas com ótimos resultados, e nós os aceitamos.”","Ou: “Entendo. Você está pensando no seu próprio filho. Como pais, não faríamos tudo pelo bem dele? Então, se recusássemos algum tratamento, teria de haver uma razão bem forte.” Leia Atos 15:28, 29 e pergunte: “Temos fé suficiente para fazer o que Deus manda?”"],x:"Atos 15:28, 29"},
{id:"o36",g:7,rs:"Raciocínios, p. 347-348",t:"Vocês não acreditam em transfusões de sangue",r:["“Você ama sua esposa (seu marido) a ponto de arriscar a vida por ela? Há quem arrisque a vida pela pátria e seja considerado herói. Deus é maior do que tudo isso. A questão para nós é lealdade a ele.” (Atos 15:28, 29)","Ou: “Evitamos várias coisas comuns hoje, como mentir, adulterar, roubar, fumar e usar sangue, porque governamos a vida pela Palavra de Deus.” Assim como Adão recebeu uma única proibição, depois do Dilúvio Deus deu a ordem sobre o sangue (Gênesis 9:3, 4).","A questão real é: temos fé em Deus? Mesmo se morrermos, ele garante a ressurreição."],x:"Gênesis 9:3, 4"},
{id:"o37",g:7,rs:"Raciocínios, p. 348",t:"E se o médico disser: “Vai morrer sem transfusão”?",r:["“Se a situação é tão grave, o médico pode garantir que o paciente não vai morrer se tomar sangue? Mas há alguém que pode devolver a vida: Deus. Seria sábio dar as costas a ele justamente nessa hora?” (João 11:25)","Ou: “Talvez isso signifique que esse médico não sabe tratar o caso sem sangue. Quando possível, procuramos um médico com experiência nisso.” Veja o tema {{sangue}}."],x:"João 11:25"},
{id:"o38",g:8,t:"Já sou salvo",r:["Que bom que você ama a Jesus. Ele disse que “quem perseverar até o fim será salvo” (Mateus 24:13). Paulo também mostrou que a salvação exige esforço contínuo (Filipenses 2:12)."],x:"Mateus 24:13"},
{id:"o39",g:8,t:"Os mortos se comunicam com a gente",r:["A Bíblia diz que os mortos “não sabem nada” (Eclesiastes 9:5) e condena consultar os mortos (Deuteronômio 18:10-12). Veja {{morte}}."],x:"Eclesiastes 9:5"},
{id:"o40",g:8,t:"Sou espírita",r:["Elogie com sinceridade o amor ao próximo e a caridade. Fale de um assunto por vez: o sofrimento, a morte ou a ressurreição. Veja {{espirita}}."],x:"João 9:1-3"},
{id:"o41",g:8,t:"Sou da umbanda / do candomblé",r:["Respeite a pessoa e evite a palavra “macumba”. Mostre que Jeová protege quem se aproxima dele. Veja {{afro}}."],x:"Provérbios 18:10"},
{id:"o42",g:8,rs:"Raciocínios, p. 21",t:"Sou budista",r:["Mostre que você não faz parte da cristandade. Fale de paz, de família e da esperança de vida eterna na Terra."],x:"Isaías 65:21-23"},
{id:"o43",g:8,rs:"Raciocínios, p. 22",t:"Sou hindu",r:["Comece por valores em comum, como a paz e a família. Para quem pensa em reencarnação, mostre o que a Bíblia diz sobre a morte e a ressurreição. Veja {{hindu}}."],x:"Eclesiastes 9:5"},
{id:"o44",g:8,rs:"Raciocínios, p. 22-23",t:"Sou judeu",r:["Diga “Escrituras Hebraicas” ou “Torá”. Mencione que adoramos o Deus de Abraão e que não cremos na Trindade. Veja {{judeu}}."],x:"Deuteronômio 6:4"},

{id:"interpretacao",g:"rac",t:"Como entender a Bíblia",k:"interpretacao interpretar entender significado",i:[
"A Bíblia tem 66 livros (39 nas Escrituras Hebraicas e 27 nas Gregas). O Autor é Jeová, mas cerca de 40 escritores foram usados ao longo de uns 1.600 anos (2 Timóteo 3:16; 2 Pedro 1:21).",
"O sentido da Bíblia não depende só da opinião de quem lê. O objetivo do estudo é descobrir o que Deus realmente quis dizer.",
"Pergunte não só “O que esse texto significa para mim?”, mas também “O que Jeová quis ensinar por meio dele?”.",
"Examine o contexto: leia os versículos antes e depois e veja quem está falando, com quem e em que situação.",
"Compare textos: deixe a Bíblia explicar a si mesma. Um texto difícil é esclarecido por outros sobre o mesmo assunto.",
"Pesquise com esforço, como quem procura um tesouro (Provérbios 2:3-5). Os bereanos examinavam as Escrituras todos os dias (Atos 17:11).",
"Peça a ajuda do Autor (Tiago 1:5, 6) e aceite a ajuda de quem conhece a Bíblia, como fez o eunuco etíope (Atos 8:30, 31). Explicar o sentido ajuda a entender (Neemias 8:8).",
"Deixe a Bíblia corrigir as suas próprias ideias, e não o contrário (2 Timóteo 3:16).",
"Ilustração: de que adiantaria um livro de receitas ou um dicionário que cada um interpretasse como quisesse? (2 Pedro 1:20, 21)"],
l:["Como entender a Bíblia (Despertai!)","https://www.jw.org/pt/biblioteca/revistas/g201211/como-entender-a-biblia/"]},
{id:"sangue",g:"rac",t:"Sangue e transfusões",k:"sangue transfusao medico tratamento",i:[

{id:"trindade",g:"rac",t:"Trindade",k:"trindade jesus deus espirito santo",v:["jesusdeus"],i:[

"Estêvão viu Jesus à direita de Deus (Atos 7:55).",

{id:"inferno",g:"rac",t:"Inferno de fogo",k:"inferno fogo castigo alma",v:["morte"],i:[

{id:"alma",g:"rac",t:"O que é a alma?",k:"alma imortal espirito morte",v:["morte"],i:["Na Bíblia, a alma é a própria pessoa, ou a vida que ela tem. O homem “se tornou uma alma vivente” (Gênesis 2:7).","A alma pode morrer: “A alma que pecar morrerá” (Ezequiel 18:4)."]},
{id:"ceu",g:"rac",t:"Quem vai para o céu?",k:"ceu 144000 governar terra",i:["Um número limitado vai para o céu para governar com Cristo: 144.000 comprados da Terra (Apocalipse 14:1, 3), um “pequeno rebanho” (Lucas 12:32).","Eles reinarão sobre a Terra (Apocalipse 5:10). A maioria viverá para sempre aqui: os mansos herdarão a Terra (Mateus 5:5; Salmo 37:29)."]},
{id:"diabo",g:"rac",t:"O Diabo existe?",k:"diabo satanas demonios mal",i:["O Diabo é uma pessoa espiritual real que se rebelou contra Deus. É o pai da mentira (João 8:44) e engana a Terra inteira (Apocalipse 12:9).","Oponha-se ao Diabo e ele fugirá (Tiago 4:7)."]},
{id:"cruz",g:"rac",t:"Cruz",k:"cruz estaca simbolo",i:[

{id:"idolos",g:"rac",t:"Imagens e ídolos",k:"imagens idolos santos estatuas icones",i:[

{id:"apocrifos",g:"rac",t:"Livros apócrifos",k:"apocrifos livros biblia catolica deuterocanonicos",i:[

function parseRef(r){
  const name=NAMES.find(n=>r.startsWith(n+" "));if(!name)return null;
  const b=BK[name];const parts=[];
  r.slice(name.length+1).split(";").forEach(seg=>{
    const m=seg.trim().match(/^(\d+):(.+)$/);if(!m)return;
    const c=+m[1],vs=[];
    m[2].split(",").forEach(x=>{const y=x.trim().split(/[-–]/).map(Number);if(y.length===2){for(let v=y[0];v<=y[1]&&vs.length<40;v++)vs.push(v)}else if(y[0])vs.push(y[0])});
    parts.push({c,vs});
  });
  return {b,name,parts};
}
const code=(b,c,v)=>String(b*1e6+c*1e3+v);
function refCode(p){const f=p.parts[0];const a=code(p.b,f.c,f.vs[0]),z=code(p.b,f.c,f.vs[f.vs.length-1]);return a===z?a:a+"-"+z}
function openRef(r){
  const p=parseRef(r);if(!p)return;
  const q="srcid=jwlshare&wtlocale=T&prefer=lang&bible="+refCode(p)+"&pub=nwtsty";
  const web="https://www.jw.org/finder?"+q;
  if(MODE==="jwl"){
    let left=false;const h=()=>{if(document.hidden)left=true};
    document.addEventListener("visibilitychange",h,{once:true});
    location.href="jwlibrary:///finder?"+q;
    setTimeout(()=>{if(!left&&!document.hidden)location.href=web},1600);
  }else window.open(web,"_blank");
}

/* ---------- BÍBLIA LOCAL (IndexedDB) ---------- */
const BIB={};
function idb(){return new Promise((res,rej)=>{const q=indexedDB.open("campofacil",1);q.onupgradeneeded=()=>q.result.createObjectStore("bib");q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function dbGet(k){const d=await idb();return new Promise(res=>{const t=d.transaction("bib").objectStore("bib").get(k);t.onsuccess=()=>res(t.result||null);t.onerror=()=>res(null)})}
async function dbPutAll(obj){const d=await idb();return new Promise((res,rej)=>{const tx=d.transaction("bib","readwrite");const st=tx.objectStore("bib");st.clear();for(const b in obj)st.put(obj[b],+b);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function getBook(b){if(BIB[b])return BIB[b];const o=await dbGet(b);if(o)BIB[b]=o;return o}

function status(t){const s=document.getElementById("status");if(s)s.textContent=t}
async function loadEpub(file){
  if(!("DecompressionStream" in window)){alert("Seu navegador é antigo para esta função. Atualize o Safari ou o Chrome.");return}
  try{
    status("Lendo o arquivo…");
    const buf=await file.arrayBuffer(),dv=new DataView(buf),u8=new Uint8Array(buf),td=new TextDecoder();
    let e=-1;for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-70000);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break}}
    if(e<0)throw new Error("O arquivo não é um EPUB válido.");
    const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const files={};
    for(let i=0;i<n;i++){
      if(dv.getUint32(p,true)!==0x02014b50)break;
      const m=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
      files[td.decode(u8.subarray(p+46,p+46+nl))]={m,cs,lo};p+=46+nl+xl+cl;
    }
    async function read(name){
      const f=files[name];if(!f)return null;
      const s=f.lo+30+dv.getUint16(f.lo+26,true)+dv.getUint16(f.lo+28,true);
      const data=u8.subarray(s,s+f.cs);
      if(f.m===0)return td.decode(data);
      return await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text();
    }
    const X=(t,ty)=>new DOMParser().parseFromString(t,ty||"application/xml");
    const cont=X(await read("META-INF/container.xml"));
    const opfPath=cont.getElementsByTagName("rootfile")[0].getAttribute("full-path");
    const dir=opfPath.includes("/")?opfPath.slice(0,opfPath.lastIndexOf("/")+1):"";
    const opf=X(await read(opfPath));
    const man={};[...opf.getElementsByTagName("item")].forEach(it=>man[it.getAttribute("id")]=decodeURIComponent(it.getAttribute("href")));
    const spine=[...opf.getElementsByTagName("itemref")].map(r=>man[r.getAttribute("idref")]).filter(Boolean);
    const out={};let book=0;
    const SKIP=/^(a|sup|aside|h1|h2|h3|h4|h5|h6|script|style|nav)$/;
    for(let i=0;i<spine.length;i++){
      if(i%40===0)status("Processando… "+Math.round(i/spine.length*100)+"%");
      const txt=await read(dir+spine[i]);
      if(!txt||txt.indexOf("_verse")<0)continue;
      let doc=X(txt,"application/xhtml+xml");
      if(doc.getElementsByTagName("parsererror").length)doc=X(txt,"text/html");
      let cur=null;
      const walk=node=>{
        for(const ch of node.childNodes){
          if(ch.nodeType===1){
            const tag=ch.localName.toLowerCase(),id=ch.getAttribute("id")||"",cls=ch.getAttribute("class")||"";
            const m=/^chapter(\d+)_verse(\d+)$/.exec(id);
            if(m){const c=+m[1],v=+m[2];if(c===1&&v===1)book++;if(book>=1&&book<=66){out[book]=out[book]||{};cur=c+":"+v;out[book][cur]=out[book][cur]||""}}
            if(SKIP.test(tag)||/foot|noteref/i.test(cls)||/footnote|noteref/.test(ch.getAttribute("epub:type")||""))continue;
            walk(ch);
          }else if(ch.nodeType===3&&cur&&out[book])out[book][cur]+=ch.nodeValue;
        }
      };
      walk(doc.body||doc.documentElement);
    }
    let count=0;
    for(const b in out){for(const k in out[b]){out[b][k]=out[b][k].replace(/\s+/g," ").trim().replace(/^\d+\s*/,"").replace(/[*+]/g,"").trim()}count++}
    if(!count)throw new Error("Não encontrei versículos neste arquivo.");
    status("Salvando no celular…");
    await dbPutAll(out);Object.assign(BIB,out);LS.set("bib",count);
    status(count===66?"Pronto! Bíblia carregada (66 livros). Toque em qualquer texto para ver o versículo.":"Atenção: encontrei "+count+" livros em vez de 66. O arquivo pode não estar completo.");
  }catch(err){status("Não consegui ler o arquivo: "+(err.message||err))}
}

  let t=[p.t,"Frase para começar: "+p.a,"Pergunta: "+p.p,"Texto: "+p.x,"Pergunta do texto: "+p.q,"Pergunta para a revisita: "+plain(p.r)].join("\n");
  (p.vis||[]).forEach(v=>t+="\n\n"+v[0]+": "+plain(v[1]));
  if(id==="celebracao"&&LS.get("cel",null))t+="\n\n"+celTxt();
  copyTxt(t,"Apresentação copiada.");
}
function rerender(id){const y=scrollY;render();const el=document.getElementById("i-"+id);if(el)el.open=true;scrollTo(0,y)}

function mesBlock(){
  const m=LS.get("mes",{t:"",a:"",p:"",x:"",q:"",r:""});
  const F=[["t","Tema"],["a","Frase para começar"],["p","Pergunta"],["x","Texto"],["q","Pergunta do texto"],["r","Pergunta para a revisita"]];
  if(EDIT)return `<div class="slab"><div class="lab">Apresentação do mês</div><div class="src" style="margin-bottom:10px">Preencha com a apresentação da Apostila da reunião.</div>
   ${F.map(f=>`<div class="lab">${f[1]}</div>${f[0]==="t"||f[0]==="x"?`<input id="m-${f[0]}" value="${esc(m[f[0]]||"")}" placeholder="${f[1]}">`:`<textarea id="m-${f[0]}" placeholder="${f[1]}">${esc(m[f[0]]||"")}</textarea>`}`).join("")}
   <div class="acts"><button class="btn p" data-act="savemes">Salvar</button><button class="btn" data-act="cancelmes">Cancelar</button></div></div>`;
  const has=F.some(f=>m[f[0]]);
  return `<div class="slab"><div class="lab">Apresentação do mês</div>
   ${has?`<div style="font-size:22px;font-weight:600;letter-spacing:-0.02em;margin:4px 0 12px">${esc(m.t||"Sem tema")}</div>${F.slice(1).map(f=>m[f[0]]?`<div class="step"><div class="lab">${f[1]}</div><div class="ans">${fmt(m[f[0]])}</div></div>`:"").join("")}`
   :`<div class="src" style="margin:6px 0 10px">Ainda não preenchida. Toque em Editar para colocar a apresentação deste mês.</div>`}
   <div class="acts"><button class="btn" data-act="editmes">Editar</button></div></div>`;
}
function renderA(){
  let h=mesBlock();
  for(const c in CATS){if(c==="rel")continue;h+=`<h2>${CATS[c]}</h2>`+PRES.filter(p=>p.c===c).map(cPres).join("")}
  return h;
}
let SUB=LS.get("sub","obj");
function renderT(){
  let h=`<div class="subs">${SUBS.map(s=>`<button class="${SUB===s[0]?"on":""}" data-act="sub" data-s="${s[0]}">${s[1]}</button>`).join("")}</div>`;
  if(SUB==="obj"){
    h+=`<h2>Quando dizem…</h2>`;
    OG.forEach((g,i)=>{const l=OBJ.filter(o=>o.g===i);if(l.length)h+=`<h3>${g}</h3>`+l.map(cObj).join("")});
  }else if(SUB==="rel"){
    h+=`<h2>Outras religiões</h2><div class="helper" style="margin-bottom:8px">Em cada uma: como começar a conversa, revisitas e “Entenda o que acreditam”.</div>`+PRES.filter(p=>p.c==="rel").map(cPres).join("");
    h+=`<h3>Quando dizem</h3>`+OBJ.filter(o=>o.g===8).map(cObj).join("");
    h+=`<h3>Livro de Mórmon</h3>`+TOP.filter(o=>o.g==="rel").map(cTop).join("");
  }else if(SUB==="sob"){
    h+=`<h2>Sobre nós</h2>`+FAQ.map((f,i)=>cFaq(IDX["f"+i].o)).join("")+`<div class="helper" style="margin-top:6px"><a target="_blank" rel="noopener" href="https://www.jw.org/pt/testemunhas-de-jeova/perguntas-frequentes/">Todas as perguntas frequentes no jw.org</a></div>`;
  }else if(SUB==="vid"){
    h+=`<h2>Vídeos</h2><div class="vids">${Object.keys(VID).map(v=>`<a class="btn" target="_blank" rel="noopener" href="${VB+VID[v][1]}">${esc(VID[v][0])}</a>`).join("")}</div>`;
  }else if(SUB==="bib"){
    const n=LS.get("bib",0);
    h+=`<h2>Bíblia no app</h2><div class="rail"><div class="txt">Para ver os versículos na bolha, carregue uma vez o arquivo EPUB da Tradução do Novo Mundo (nwt_T.epub). O texto fica guardado no celular e funciona sem internet.</div>
     <div class="acts"><button class="btn p" data-act="loadbib">${n?"Carregar de novo":"Carregar Bíblia"}</button><a class="btn" target="_blank" rel="noopener" href="https://www.jw.org/pt/biblioteca/biblia/">Baixar o EPUB no jw.org</a></div>
     <div id="status">${n?"Bíblia carregada ("+n+" livros).":""}</div></div>`;
  }else{
    const s=SUBS.find(x=>x[0]===SUB)||SUBS[1];
    h+=`<h2>${s[1]}</h2>`+TOP.filter(o=>o.g===s[0]).map(cTop).join("");
  }
  return h;
}

function renderF(){
  const l=FAVS.filter(id=>IDX[id]);
  return l.length?`<h2>Favoritos</h2>`+l.map(card).join(""):`<div class="empty">Nenhum favorito ainda. Toque em “Favoritar” em qualquer apresentação ou resposta para ela aparecer aqui.</div>`;
}

/* ---------- PESQUISA ---------- */
const STOP=new Set("a o e de da do das dos os as que um uma em no na nos nas para por com se ou ao".split(" "));
function bodyOf(it){const o=it.o,J=a=>Array.isArray(a)?a.flat(3).join(" "):(a||"");return plain([o.a,o.p,o.x,o.q,o.r,o.n,o.i,o.vis,o.cui,o.cren,o.tab].map(J).join(" "))}
function score(it,terms,full){
  const title=norm(plain(it.t)),tw=title.split(/[^a-z0-9]+/),kw=norm(it.o.k||"").split(/\s+/),body=norm(bodyOf(it));
  let s=0;if(title.includes(full))s+=40;
  for(const t of terms){
    let ts=0;
    if(tw.includes(t))ts+=30;else if(tw.some(w=>w.startsWith(t)))ts+=20;else if(title.includes(t))ts+=10;
    if(kw.includes(t))ts+=15;else if(kw.some(w=>w.startsWith(t)))ts+=10;
    const c=body.split(t).length-1;if(c)ts+=2+Math.min(c,3);
    if(!ts)return 0;s+=ts;
  }
  return s;
}
function renderSearch(q){
  const full=norm(q.trim());const terms=full.split(/\s+/).filter(t=>t&&!STOP.has(t));
  if(!terms.length)return `<div class="empty">Digite uma palavra para pesquisar.</div>`;
  const res=Object.keys(IDX).map(id=>[id,score(IDX[id],terms,full)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
  return res.length?`<h2>Resultados</h2>`+res.map(x=>card(x[0])).join(""):`<div class="empty">Nada encontrado para “${esc(q)}”. Tente outra palavra.</div>`;
}

/* ---------- CONTROLE ---------- */
const main=document.getElementById("main"),qEl=document.getElementById("q");
function render(){
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===TAB&&!qEl.value.trim()));
  document.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("on",b.dataset.m===MODE));
  main.innerHTML=qEl.value.trim()?renderSearch(qEl.value):TAB==="a"?renderA():TAB==="t"?renderT():renderF();
}
function jump(id){
  const it=IDX[id];if(!it)return;hidePop();
    qEl.value="";const rel=it.ty==="p"&&it.o.c==="rel";TAB=it.ty==="p"&&!rel?"a":"t";
  if(rel)SUB="rel";else if(it.ty==="o")SUB="obj";else if(it.ty==="q")SUB="sob";else if(it.ty==="x")SUB=it.o.g;
  LS.set("tab",TAB);LS.set("sub",SUB);render();
  const el=document.getElementById("i-"+id);if(!el)return;
  el.open=true;el.scrollIntoView({block:"start"});el.classList.add("hl");setTimeout(()=>el.classList.remove("hl"),2000);
}
function copyPres(id){
  const p=IDX[id].o;
  const t=[p.t,"Frase para começar: "+p.a,"Pergunta: "+p.p,"Texto: "+p.x,"Pergunta do texto: "+p.q,"Pergunta para a revisita: "+plain(p.r)].join("\n");
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>alert("Apresentação copiada.")).catch(()=>prompt("Copie o texto:",t));
}
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;TAB=b.dataset.tab;LS.set("tab",TAB);qEl.value="";EDIT=false;render();scrollTo(0,0)});
qEl.addEventListener("input",()=>{hidePop();render()});
document.getElementById("epub").addEventListener("change",e=>{const f=e.target.files[0];if(f){hidePop();TAB="t";SUB="bib";qEl.value="";render();document.getElementById("status").scrollIntoView({block:"center"});loadEpub(f)}e.target.value=""});
document.addEventListener("click",e=>{
  const ref=e.target.closest("a.ref");
  if(ref){e.preventDefault();const r=ref.dataset.r;if(popRef===r&&pop.style.display==="block"){hidePop();openRef(r)}else showPop(ref,r);return}
  const j=e.target.closest("a.jump");if(j){e.preventDefault();jump(j.dataset.j);return}
  const b=e.target.closest("[data-act]");
  if(b){
    const a=b.dataset.act;
    if(a==="openref"){const r=popRef;hidePop();openRef(r)}
    else if(a==="closepop")hidePop();
    else if(a==="sub"){SUB=b.dataset.s;LS.set("sub",SUB);render();scrollTo(0,0);const on=document.querySelector(".subs .on");if(on)on.scrollIntoView({inline:"center",block:"nearest"})}
    else if(a==="loadbib")document.getElementById("epub").click();
    else if(a==="mode"){MODE=b.dataset.m;LS.set("abrir",MODE);document.querySelectorAll(".seg button").forEach(x=>x.classList.toggle("on",x.dataset.m===MODE))}
    else if(a==="fav"){const id=b.dataset.id;FAVS=isFav(id)?FAVS.filter(x=>x!==id):[...FAVS,id];LS.set("favs",FAVS);if(TAB==="f"&&!qEl.value.trim())render();else document.querySelectorAll(`[data-act="fav"][data-id="${id}"]`).forEach(x=>{x.classList.toggle("on",isFav(id));x.textContent=isFav(id)?"Favorito":"Favoritar"})}
     else if(a==="copy")copyPresX(b.dataset.id);
    else if(a==="editcel"){CELEDIT=true;rerender("celebracao")}
    else if(a==="cancelcel"){CELEDIT=false;rerender("celebracao")}
    else if(a==="savecel"){LS.set("cel",{d:document.getElementById("c-d").value,h:document.getElementById("c-h").value,l:document.getElementById("c-l").value.trim()});CELEDIT=false;rerender("celebracao")}
    else if(a==="copycel")copyTxt(celTxt(),"Convite copiado.");
    else if(a==="editmes"){EDIT=true;render()}
    else if(a==="cancelmes"){EDIT=false;render()}
    else if(a==="savemes"){const m={};["t","a","p","x","q","r"].forEach(k=>m[k]=document.getElementById("m-"+k).value.trim());LS.set("mes",m);EDIT=false;render()}
    return;
  }
  if(!e.target.closest("#pop"))hidePop();
});
addEventListener("scroll",()=>{if(pop.style.display==="block")hidePop()},{passive:true});
